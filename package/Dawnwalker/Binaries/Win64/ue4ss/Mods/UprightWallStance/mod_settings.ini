[Mod]
Id = UprightWallStance
Name = Upright Wall Stance
Author = penicius-code
Version = 1.0.3
Description = Coen stands upright when clinging to walls instead of crouching. The hotkey is set in config.ini.

[Setting.enabled]
Id = enabled
Type = toggle
Label = Upright on walls
Description = Coen stands upright on walls. Off restores the vanilla crouched pose.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Enabled

[Setting.fixwolfhaste]
Id = fixwolfhaste
Type = toggle
Label = Fix stuck wolf
Description = Repairs the wolf after wolf Haste + Shadowstep (vanilla bug: wolf stuck in one pose until Coen transforms a few times).
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = FixWolfHaste

[Setting.logging]
Id = logging
Type = toggle
Label = Debug log
Description = Writes UprightWallStance.log next to Dawnwalker.exe. Only needed for bug reports.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Logging
