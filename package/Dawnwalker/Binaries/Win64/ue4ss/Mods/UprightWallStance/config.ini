; Upright Wall Stance settings
; Changes are picked up while the game is running (checked every 2 seconds).

[Settings]
; 1 = Coen stands upright on walls, 0 = vanilla crouched pose
Enabled = 1

; Key that toggles the effect in game. Uses UE4SS key names, for example:
; NUM_FOUR, NUM_ZERO, F7, INS, HOME, END, PAGE_UP
; Leave empty to disable the hotkey.
ToggleKey = F7

; 1 = repair the wolf after wolf Haste + Shadowstep (vanilla bug: wolf stuck in one pose,
; sliding around, until Coen transforms a few times). 0 = vanilla behaviour.
FixWolfHaste = 1

; 1 = write UprightWallStance.log next to Dawnwalker.exe (for bug reports)
Logging = 0
